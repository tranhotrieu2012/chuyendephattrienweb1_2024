<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forum Topics</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <div class="header">
        <p>Viewing 15 topics - 1 through 15 (of 21 total)</p>
        <div class="pagination" id="pagination"></div>
      </div>
      <table id="topicsTable">
        <thead>
          <tr>
            <th>Topic</th>
            <th>Voices</th>
            <th>Posts</th>
            <th>Last Post</th>
          </tr>
        </thead>
        <tbody id="topicsBody"></tbody>
      </table>
    </div>

    <script src="./paganition.js"></script>
  </body>
</html>
